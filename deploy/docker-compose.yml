name: webpc

services:
  db:
    image: postgres:16
    container_name: webpc-db
    ports:
      - "${DB_PUBLIC_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-sylein}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-123456}"
      POSTGRES_DB: "${DB_NAME:-webpc}"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Chi chay 1 lan luc khoi tao volume (db rong). Luu y: script nay co DROP TABLE.
      - ../dbBanLinhKienPC_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sylein} -d ${DB_NAME:-webpc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  be:
    build:
      context: ../BE
    container_name: webpc-be
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BE_PUBLIC_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      SERVER_PORT: "8081"
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME:-webpc}"
      DB_USERNAME: "${DB_USERNAME:-sylein}"
      DB_PASSWORD: "${DB_PASSWORD:-123456}"
      APP_PUBLIC_BASE_URL: "${BE_PUBLIC_BASE_URL:-http://34.126.165.66:8081}"
      APP_JWT_ISSUER: "${BE_JWT_ISSUER:-http://34.126.165.66:8081}"
      APP_JWT_AUDIENCE: "${BE_JWT_AUDIENCE:-http://34.126.165.66:8081}"
    volumes:
      - be_uploads:/app/uploads
    restart: unless-stopped

  fe:
    build:
      context: ..
      dockerfile: deploy/fe-combined/Dockerfile
    container_name: webpc-fe
    depends_on:
      - be
    ports:
      - "${FE_PUBLIC_PORT:-22222}:8080"
    environment:
      # Ca FE va FE_NHANVIEN goi BE bang server-side Java HttpClient,
      # nen co the dung network noi bo Docker.
      APP_BACKEND_API_BASE_URL: "http://be:8081/api/"
    restart: unless-stopped

volumes:
  db_data:
  be_uploads:
