spring:
  application:
    name: webpc-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webpc}
    username: ${DB_USERNAME:sylein}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    key: ${APP_JWT_KEY:WEBPC_SUPER_SECRET_KEY_2026_CHANGE_ME_NOW_1234567890}
    issuer: ${APP_JWT_ISSUER:http://localhost:8081}
    audience: ${APP_JWT_AUDIENCE:http://localhost:8081}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:24}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}
  cloudinary:
    cloud-name: ${APP_CLOUDINARY_CLOUD_NAME:dqzhmwatd}
    api-key: ${APP_CLOUDINARY_API_KEY:979588842784216}
    api-secret: ${APP_CLOUDINARY_API_SECRET:REBEEEApPEzl6xnsJ7SuzY9yK2A}
    folder:
      avatar: ${APP_CLOUDINARY_FOLDER_AVATAR:WEBPC/Avatars}
      product: ${APP_CLOUDINARY_FOLDER_PRODUCT:WEBPC/Products}
  mail:
    from-address: ${APP_MAIL_FROM:no-reply@example.com}
    from-name: ${APP_MAIL_FROM_NAME:WEBPC Support}
  location-api:
    base-url: ${APP_LOCATION_API_BASE_URL:https://esgoo.net/api-tinhthanh}
